# Overrides layered on top of Cowrie's packaged defaults (cowrie.cfg.dist,
# built into the image). Every value below already matches the current
# default - they're pinned explicitly so a future Cowrie release can't
# silently change this honeypot's behavior (e.g. flip telnet back on).

[honeypot]
hostname = svr-prod-01

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json

[ssh]
enabled = true

[telnet]
# Only SSH is exposed by docker-compose.yml; keep the telnet listener off too.
enabled = false
